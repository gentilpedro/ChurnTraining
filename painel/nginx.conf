server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # Sem isto o nginx serve text/html "pelado" e o navegador chuta a codificação,
    # transformando "estável" em "estÃ¡vel"
    charset utf-8;
    charset_types text/html text/plain text/css application/json;

    # A raiz abre o painel direto, sem precisar do nome do arquivo na URL
    index painel.html;

    # O painel é reescrito a cada treino: sem cache, um F5 basta para ver as
    # notas novas em vez de uma versão guardada pelo navegador
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
    }

    # /api/... vai para a Churn API: a página de injeção chama a API pelo mesmo
    # endereço do site, sem precisar de CORS. O nome 'api' é resolvido a cada
    # requisição (resolver + variável), então o site sobe mesmo com a API fora.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        client_max_body_size 10m;
    }
}
